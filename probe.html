<!doctype html>
<html><body>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

const list = (new URLSearchParams(location.search).get('models') || '').split(',').filter(Boolean);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(480, 320);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xfff2dd, 2.4); key.position.set(3, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x8090b0, 0.9); fill.position.set(-3, 1, -2); scene.add(fill);
const cam = new THREE.PerspectiveCamera(40, 480 / 320, 0.01, 200);
const loader = new GLTFLoader();
window.__results = [];
for (const dir of list) {
  const rec = { dir, ok: false };
  try {
    const g = await loader.loadAsync(`/assets/models/${dir}/model.gltf`);
    const root = g.scene;
    const bb = new THREE.Box3().setFromObject(root);
    const size = bb.getSize(new THREE.Vector3());
    let meshes = 0, tris = 0, texCount = 0;
    root.traverse((o) => {
      if (o.isMesh) {
        meshes++;
        const idx = o.geometry.index;
        tris += idx ? idx.count / 3 : o.geometry.attributes.position.count / 3;
        const m = o.material;
        const ms = Array.isArray(m) ? m : [m];
        for (const mm of ms) for (const k of ['map','normalMap','roughnessMap','metalnessMap','aoMap']) if (mm && mm[k]) texCount++;
      }
    });
    rec.meshes = meshes; rec.tris = Math.round(tris); rec.tex = texCount;
    rec.size = [size.x, size.y, size.z].map((v) => +v.toFixed(2));
    // fit camera to the model and render one frame
    scene.add(root);
    const r = Math.max(size.x, size.y, size.z) || 1;
    cam.position.set(r * 1.35, size.y * 0.75 + r * 0.3, r * 1.35);
    cam.lookAt(0, size.y * 0.45, 0);
    renderer.render(scene, cam);
    rec.ok = true;
    window.__lastShot = renderer.domElement.toDataURL('image/png');
    scene.remove(root);
  } catch (e) { rec.err = String(e && e.message || e).slice(0, 160); }
  window.__results.push(rec);
}
window.__done = true;
</script>
</body></html>
